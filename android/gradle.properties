# COMPAT keeps the daemon default charset in line with the OS native encoding.
# On Windows the JDK launcher decodes worker @argfiles with the ANSI code page,
# so a UTF-8 classpath file breaks worker startup on non-ASCII user paths.
# COMPAT writes GBK off the same code page here and stays UTF-8 on Linux/macOS.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 defaults to debug tests only; the release gate also exercises release classes.
android.onlyEnableUnitTestForTheTestedBuildType=false
