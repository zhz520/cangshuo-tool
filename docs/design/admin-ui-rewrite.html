  #cs-admin-rewrite .cs-page-meta { display:none; }
  #cs-admin-rewrite .cs-tabs { gap:15px; }
  #cs-admin-rewrite .cs-desktop .cs-table thead { display:none; }
  #cs-admin-rewrite .cs-desktop .cs-table, #cs-admin-rewrite .cs-desktop .cs-table tbody { display:block; }
  #cs-admin-rewrite .cs-desktop .cs-table tr { display:grid; grid-template-columns:minmax(0,1fr) auto; border-bottom:1px solid var(--cs-border); padding:14px; gap:9px; }
  #cs-admin-rewrite .cs-desktop .cs-table td { display:block; height:auto; padding:0; border:0; }
  #cs-admin-rewrite .cs-desktop .cs-table td:first-child { grid-column:1 / -1; }

  #cs-admin-rewrite .cs-desktop .cs-table td:nth-child(4) { grid-column:1; grid-row:3; }
  #cs-admin-rewrite .cs-desktop .cs-table td:nth-child(5) { grid-column:2; grid-row:3; text-align:right; }

  #cs-admin-rewrite .cs-icon-button, #cs-admin-rewrite .cs-button, #cs-admin-rewrite .cs-primary-button, #cs-admin-rewrite .cs-row-action, #cs-admin-rewrite .cs-status-tab { min-height:44px; }
  #cs-admin-rewrite .cs-icon-button { width:44px; }
  #cs-admin-rewrite .cs-form-label select, #cs-admin-rewrite .cs-form-label textarea { font-size:16px; }

</style>
<script>
(() => {
  const root = document.getElementById('cs-admin-rewrite');
  const state = { theme:'dark', compact:false, accent:'#b5ff45', radius:10 };
  const labels = { PENDING:'待处理', PROCESSING:'处理中', RESOLVED:'已解决' };
  const types = { BUG:'问题', SUGGESTION:'建议', OTHER:'其他' };
  const samples = [
    { id:1086,userId:1024,email:'lin@example.com',type:'BUG',title:'二维码导出后如何选择保存位置？',content:'生成二维码后想把图片保存到指定文件夹，希望能看到更明确的保存提示。',contact:null,status:'PENDING',time:'11:24',reply:'' },
    { id:1085,userId:1017,email:'chen@example.com',type:'SUGGESTION',title:'希望常用工具可以更快找到',content:'经常使用单位转换和时间戳，希望首页常用入口更容易找到。',contact:null,status:'PENDING',time:'10:52',reply:'' },
    { id:1084,userId:996,email:'yu@example.com',type:'BUG',title:'深色主题下部分文字不容易看清',content:'打开深色主题后，部分说明文字颜色比较暗，希望提高对比度。',contact:'yu@example.com',status:'PROCESSING',time:'10:18',reply:'我们已收到反馈，正在检查相关页面。' },
    { id:1083,userId:984,email:'zhou@example.com',type:'SUGGESTION',title:'希望完善 PDF 页面选择说明',content:'提取页面时，希望更清楚地看到重复页码与页面顺序的处理方式。',contact:null,status:'PENDING',time:'09:46',reply:'' },
    { id:1082,userId:980,email:'qing@example.com',type:'OTHER',title:'工具列表的分类说明在哪里查看？',content:'想了解各个分类包含的工具范围。',contact:null,status:'PROCESSING',time:'09:12',reply:'' },
    { id:1081,userId:969,email:'wang@example.com',type:'BUG',title:'已找到语言设置入口',content:'之前没有找到切换语言的入口，现在已在设置中找到。',contact:null,status:'RESOLVED',time:'08:40',reply:'可以在「我的」设置中调整应用语言。' }
  ];
  const escape = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const template = root.querySelector('.cs-shell-template');
  const instances = [];
  root.querySelectorAll('[data-stage]').forEach((app,index) => {
    app.appendChild(template.content.cloneNode(true));
    const model = { app, index, status:'ALL', keyword:'', page:'feedback', navigationOpen:app.dataset.stage === 'mobile', editing:null, trigger:null, items:samples.map(item => ({...item})) };
    instances.push(model);
    const tableBody = app.querySelector('tbody');
    const layer = app.querySelector('.cs-detail-layer');
    const navScrim = app.querySelector('.cs-nav-scrim');
    function setNavigation(open) { model.navigationOpen = open; renderInstance(model); if (open) app.querySelector('.cs-close-nav').focus(); else app.querySelector('.cs-menu-button').focus(); remember(); }
    function closeDetail() { model.editing = null; layer.hidden = true; if (model.trigger) model.trigger.focus(); }
    app.querySelector('.cs-menu-button').addEventListener('click',() => setNavigation(true));
    app.querySelector('.cs-close-nav').addEventListener('click',() => setNavigation(false));
    navScrim.addEventListener('click',() => setNavigation(false));
    app.querySelector('.cs-theme-button').addEventListener('click',() => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); remember(); });
    app.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click',() => { model.page = button.dataset.page; model.navigationOpen = false; renderInstance(model); remember(); }));
    app.querySelectorAll('[data-status]').forEach(button => button.addEventListener('click',() => { model.status = button.dataset.status; renderInstance(model); remember(); }));
    app.querySelector('.cs-filter').addEventListener('submit',event => { event.preventDefault(); model.keyword = app.querySelector('input[name="keyword"]').value.trim(); renderInstance(model); });
    app.querySelector('input[name="keyword"]').addEventListener('input',event => { if (!event.target.value) { model.keyword = ''; renderInstance(model); } });
    tableBody.addEventListener('click',event => {
      const trigger = event.target.closest('[data-edit]');
      if (!trigger) return;
      const item = model.items.find(entry => entry.id === Number(trigger.dataset.edit));
      if (!item) return;
      model.editing = item;
      model.trigger = trigger;
      app.querySelector('.cs-detail-id').textContent = `FEEDBACK / #${item.id}`;
      app.querySelector('.cs-detail-user').textContent = `${item.email} · 用户 #${item.userId} · 10-06 ${item.time}`;
      app.querySelector('.cs-original-content').textContent = item.content;
      app.querySelector('.cs-detail-contact').textContent = `联系方式：${item.contact || '未提供'}`;
      app.querySelector('select[name="status"]').value = item.status;
      app.querySelector('textarea[name="reply"]').value = item.reply;
      layer.hidden = false;
      app.querySelector('.cs-close-detail').focus();
    });
    app.querySelector('.cs-detail-scrim').addEventListener('click',closeDetail);
    app.querySelector('.cs-close-detail').addEventListener('click',closeDetail);
    app.querySelector('.cs-cancel-detail').addEventListener('click',closeDetail);
    app.querySelector('.cs-detail-form').addEventListener('submit',event => {
      event.preventDefault();
      if (!model.editing) return;
      const nextStatus = app.querySelector('select[name="status"]').value;
      if (!Object.prototype.hasOwnProperty.call(labels,nextStatus)) return;
      model.editing.status = nextStatus;
      const reply = app.querySelector('textarea[name="reply"]').value.trim();
      if (reply) model.editing.reply = reply;
      closeDetail();
      renderInstance(model);
      app.querySelector('.cs-local-notice').textContent = '示例已更新，未写入后台服务。';
    });
    app.addEventListener('keydown',event => {
      const detailOpen = !layer.hidden;
      const menuIsOverlay = model.navigationOpen && (app.dataset.stage === 'mobile' || root.getBoundingClientRect().width <= 880);
      if (event.key === 'Escape') { if (detailOpen) closeDetail(); else if (menuIsOverlay) setNavigation(false); }
      if (event.key !== 'Tab' || (!detailOpen && !menuIsOverlay)) return;
      const scope = detailOpen ? app.querySelector('.cs-detail') : app.querySelector('.cs-sidebar');
      const controls = Array.from(scope.querySelectorAll('button,input,textarea,select')).filter(element => !element.disabled && element.getClientRects().length > 0);
      const first = controls[0], last = controls[controls.length - 1];
      if (!first) return;
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
  });
  function renderInstance(model) {
    const app = model.app;
    app.classList.toggle('cs-light',state.theme === 'light');
    app.classList.toggle('cs-nav-open',model.navigationOpen);
    app.style.setProperty('--cs-accent',state.accent);
    app.style.setProperty('--cs-radius',`${state.radius}px`);
    app.style.setProperty('--cs-row-height',state.compact ? '48px' : '62px');
    app.querySelector('.cs-nav-scrim').hidden = !model.navigationOpen;
    app.querySelector('.cs-theme-button').setAttribute('aria-label',state.theme === 'dark' ? '切换浅色主题' : '切换深色主题');
    app.querySelector('.cs-current-title').textContent = model.page === 'feedback' ? '用户反馈' : '概览';
    app.querySelector('.cs-feedback-page').hidden = model.page !== 'feedback';
    app.querySelector('.cs-dashboard-page').hidden = model.page !== 'dashboard';
    app.querySelectorAll('.cs-navigation [data-page]').forEach(button => { const selected = button.dataset.page === model.page; button.classList.toggle('cs-current',selected); if (selected) button.setAttribute('aria-current','page'); else button.removeAttribute('aria-current'); });
    const counts = { ALL:model.items.length, PENDING:0, PROCESSING:0, RESOLVED:0 };
    model.items.forEach(item => { counts[item.status] += 1; });
    app.querySelector('.cs-total').textContent = String(counts.ALL);
    app.querySelector('.cs-nav-count').textContent = String(counts.PENDING);
    app.querySelectorAll('[data-count]').forEach(span => { span.textContent = String(counts[span.dataset.count]); });
    app.querySelectorAll('[data-status]').forEach(button => { const selected = model.status === button.dataset.status; button.classList.toggle('cs-selected',selected); button.setAttribute('aria-pressed',String(selected)); });
    const query = model.keyword.toLocaleLowerCase();
    const shown = model.items.filter(item => (model.status === 'ALL' || item.status === model.status) && (!query || [item.title,item.content,item.email,item.contact || ''].some(value => value.toLocaleLowerCase().includes(query))));
    app.querySelector('tbody').innerHTML = shown.map(item => `<tr><td><span class="cs-feedback-title">${escape(item.title)}</span><span class="cs-type">${types[item.type]} · #${item.id}</span></td><td><span class="cs-user-email">${escape(item.email)}</span><span class="cs-user-id">用户 #${item.userId}</span></td><td><span class="cs-status ${item.status}">${labels[item.status]}</span></td><td><span class="cs-time">10-06</span><span class="cs-time">${item.time}</span></td><td><button type="button" class="cs-row-action cursor-interaction" data-edit="${item.id}" aria-label="处理反馈 ${item.id}">处理</button></td></tr>`).join('');
    app.querySelector('.cs-empty').hidden = shown.length !== 0;
    app.querySelector('.cs-result-count').textContent = `${shown.length} 条示例反馈`;
  }
  function render() { instances.forEach(renderInstance); }
  function restore(saved) { const value = saved && saved.modelContent; if (value && ['dark','light'].includes(value.theme)) state.theme = value.theme; if (value && typeof value.compact === 'boolean') state.compact = value.compact; const pages = saved && saved.privateContent && saved.privateContent.pages; if (Array.isArray(pages)) instances.forEach((model,index) => { const entry = pages[index]; if (!entry) return; if (['ALL','PENDING','PROCESSING','RESOLVED'].includes(entry.status)) model.status = entry.status; if (['feedback','dashboard'].includes(entry.page)) model.page = entry.page; if (typeof entry.navigationOpen === 'boolean') model.navigationOpen = entry.navigationOpen; }); render(); }
  function remember() { if (window.openai && typeof window.openai.setWidgetState === 'function') window.openai.setWidgetState({ modelContent:{ design:'沧烁后台重写',theme:state.theme,compact:state.compact },privateContent:{ pages:instances.map(model => ({ status:model.status,page:model.page,navigationOpen:model.navigationOpen })) } }).catch(() => {}); }
  restore(window.openai && window.openai.widgetState);
  window.addEventListener('openai:set_globals',event => { if (event.detail && event.detail.globals && event.detail.globals.widgetState) restore(event.detail.globals.widgetState); });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container:root, onChange:() => { render(); remember(); } });
    tweak.addSelect(state,'theme',{label:'主题',options:[{label:'深色',value:'dark'},{label:'浅色',value:'light'}]});
    tweak.addToggle(state,'compact',{label:'紧凑表格'});
    tweak.addSlider(state,'radius',{label:'容器圆角',min:4,max:14,step:1,unit:'px',reference:'--cs-radius'});
  }
})();
</script>
