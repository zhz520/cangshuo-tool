ace-variant select-none"><span class="">09:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div><div class="h-14 flex items-center justify-between"><div class="flex items-center gap-space-xs"><button class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">标准与科学计算器</h1></div></div></div></header><main class="flex flex-col relative w-full pt-20 pb-safe px-margin bg-surface"><div class="flex flex-col w-full pb-6 space-y-4">

<button class="h-9 rounded-lg bg-surface-container-lowest text-on-surface text-label-mono font-label-mono shadow-sm active:bg-surface-container transition-colors" onclick="appendFunction('sin(')">sin</button>

<button class="h-9 rounded-lg bg-surface-container-lowest text-on-surface text-label-mono font-label-mono shadow-sm active:bg-surface-container transition-colors" onclick="appendFunction('tan(')">tan</button>
<button class="h-9 rounded-lg bg-surface-container-lowest text-on-surface text-label-mono font-label-mono shadow-sm active:bg-surface-container transition-colors" onclick="appendFunction('π')">π</button>

<button class="h-9 rounded-lg bg-surface-container-lowest text-on-surface text-label-mono font-label-mono shadow-sm active:bg-surface-container transition-colors" onclick="appendFunction('^')">xʸ</button>

<div class="flex flex-col bg-surface-container-lowest rounded-xl p-4 shadow-sm space-y-3 relative overflow-hidden">
<!-- 装饰性渐变冷灰微底纹 -->

<!-- 滚动历史回溯 (History Log) -->

<div class="text-label-mono font-label-mono text-outline select-none opacity-60">256 × 8 = 2,048</div>
<div class="text-label-mono font-label-mono text-outline select-none">1,248 × 3.5 = 4,368</div>

</div>
<!-- 醒目主计算结果区 (Interactive Result Card) -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center gap-1.5">
<span class="hidden items-center gap-1 px-2 py-0.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-md text-label-md" id="copy-badge">

<span class="font-display-lg text-display-lg text-primary font-bold tracking-tight select-none">=</span>
<span class="font-display-lg text-display-lg text-on-surface font-bold tracking-tight group-hover:text-primary transition-colors" id="current-result">522.4</span>
</div>
</div>

<!-- 快捷辅助胶囊工具条 (Utility Pill Row) -->
<div class="grid grid-cols-4 gap-2">
<button class="h-11 rounded-full bg-error-container text-on-error-container font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1 active:opacity-80 transition-opacity shadow-sm" onclick="clearAll()">
<span class="material-symbols-outlined text-[18px]">delete_sweep</span>
<span class="">AC</span>
</button>
<button class="h-11 rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-1 active:bg-surface-container-high transition-colors shadow-sm" onclick="handleBackspace()">
<span class="material-symbols-outlined text-[18px]">backspace</span>
<span class="">退格</span>
</button>
<button class="h-11 rounded-full bg-surface-container text-on-surface font-label-mono text-label-mono font-semibold flex items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" onclick="insertParentheses()">
      ( )
    </button>
<button class="h-11 rounded-full bg-surface-container-high text-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1 active:bg-surface-variant transition-colors shadow-sm" onclick="copyCurrentResult()">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
<span class="">复制</span>
</button>
</div>
<!-- 物理质感数字与算符键盘 (Keypad Grid 4x5) -->
<div class="grid grid-cols-4 gap-2.5 pt-1">
<!-- Row 1 -->
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-label-mono text-[20px] font-medium shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="toggleSign()">
      ±
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-label-mono text-[20px] font-medium shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendOperator('%')">
      %
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-label-mono text-[18px] font-medium shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendFunction('1/')">
      1/x
    </button>
<button class="h-14 rounded-2xl bg-surface-container-high text-primary font-label-mono text-[22px] font-semibold shadow-sm active:bg-surface-variant transition-all duration-100 flex items-center justify-center" onclick="appendOperator('÷')">
      ÷
    </button>
<!-- Row 2 -->
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('7')">
      7
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('8')">
      8
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('9')">
      9
    </button>
<button class="h-14 rounded-2xl bg-surface-container-high text-primary font-label-mono text-[22px] font-semibold shadow-sm active:bg-surface-variant transition-all duration-100 flex items-center justify-center" onclick="appendOperator('×')">
      ×
    </button>
<!-- Row 3 -->
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('4')">
      4
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('5')">
      5
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('6')">
      6
    </button>
<button class="h-14 rounded-2xl bg-surface-container-high text-primary font-label-mono text-[22px] font-semibold shadow-sm active:bg-surface-variant transition-all duration-100 flex items-center justify-center" onclick="appendOperator('-')">
      −
    </button>
<!-- Row 4 -->
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('1')">
      1
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('2')">
      2
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('3')">
      3
    </button>
<button class="h-14 rounded-2xl bg-surface-container-high text-primary font-label-mono text-[22px] font-semibold shadow-sm active:bg-surface-variant transition-all duration-100 flex items-center justify-center" onclick="appendOperator('+')">
      +
    </button>
<!-- Row 5 -->
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-data-metric shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('0')">
      0
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-headline-sm shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDigit('00')">
      00
    </button>
<button class="h-14 rounded-2xl bg-surface-container-lowest text-on-surface font-data-metric text-[22px] font-bold shadow-sm active:bg-surface-container-low transition-all duration-100 flex items-center justify-center" onclick="appendDecimal()">
      .
    </button>
<button class="h-14 rounded-2xl bg-primary-container text-on-primary font-label-mono text-[26px] font-bold shadow-md active:opacity-90 active:scale-[0.98] transition-all duration-100 flex items-center justify-center" onclick="calculateEquals()">
      =
    </button>
</div>
<!-- 底部微交互保障与离线声明 (Subtle Local Guarantee) -->
<div class="flex items-center justify-center gap-1.5 pt-2 text-center text-on-surface-variant select-none">
<span class="material-symbols-outlined text-[14px] text-tertiary">lock</span>
<span class="font-body-sm text-body-sm">轻点计算结果可直接复制 · 本地高精度计算</span>
</div>
</div>
<script>
  let currentExpr = '1,248 ÷ 2.389';
  let currentRes = '522.4';
  let isRad = false;
  let parenState = false;

  function toggleRadDeg() {
    isRad = !isRad;
    const txt = document.getElementById('deg-rad-text');
    txt.textContent = isRad ? '弧度 RAD' : '角度 DEG';
  }

  function cycleMode() {
    const p = document.getElementById('sci-panel');
    p.classList.toggle('hidden');
    p.classList.toggle('grid');
  }

  function updateDisplay() {
    document.getElementById('current-expression').innerText = currentExpr || '0';
    document.getElementById('current-result').innerText = currentRes;
  }

  function appendDigit(val) {
    if (currentExpr === '0' || currentExpr === '1,248 ÷ 2.389') {
      currentExpr = val;
    } else {
      currentExpr += val;
    }
    mockCompute();
    updateDisplay();
  }

  function appendDecimal() {
    if (!currentExpr.endsWith('.')) {
      currentExpr += '.';
      updateDisplay();
    }
  }

  function appendOperator(op) {
    currentExpr += ' ' + op + ' ';
    updateDisplay();
  }

  function appendFunction(fn) {
    if (currentExpr === '0' || currentExpr === '1,248 ÷ 2.389') {
      currentExpr = fn;
    } else {
      currentExpr += fn;
    }
    updateDisplay();
  }

  function toggleSign() {
    if (currentExpr.startsWith('-')) {
      currentExpr = currentExpr.substring(1);
    } else {
      currentExpr = '-' + currentExpr;
    }
    mockCompute();
    updateDisplay();
  }

  function handleBackspace() {
    if (currentExpr.length > 0) {
      currentExpr = currentExpr.trimEnd();
      currentExpr = currentExpr.slice(0, -1).trimEnd();
      if (currentExpr === '') currentExpr = '0';
      mockCompute();
      updateDisplay();
    }
  }

  function clearAll() {
    currentExpr = '0';
    currentRes = '0';
    updateDisplay();
  }

  function insertParentheses() {
    if (!parenState) {
      appendDigit('(');
      parenState = true;
    } else {
      appendDigit(')');
      parenState = false;
    }
  }

  function mockCompute() {
    try {
      let sanitized = currentExpr.replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, '');
      if (sanitized && !/[+\-*/]$/.test(sanitized.trim())) {
        let val = eval(sanitized);
        if (!isNaN(val) && isFinite(val)) {
          currentRes = Number(val.toFixed(8)).toString();
          return;
        }
      }
    } catch(e) {}
  }

  function calculateEquals() {
    mockCompute();
    const history = document.getElementById('history-container');
    const row = document.createElement('div');
    row.className = 'text-label-mono font-label-mono text-outline select-none';
    row.innerText = currentExpr + ' = ' + currentRes;
    history.appendChild(row);
    if (history.children.length > 3) {
      history.removeChild(history.children[0]);
    }
    currentExpr = currentRes;
    updateDisplay();
  }

  function copyCurrentResult() {
    const resText = document.getElementById('current-result').innerText;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(resText);
    }
    const badge = document.getElementById('copy-badge');
    badge.classList.remove('hidden');
    badge.classList.add('inline-flex');
    setTimeout(() => {
      badge.classList.add('hidden');
      badge.classList.remove('inline-flex');
    }, 1500);
  }
</script></main><div class="fixed bottom-0 w-full flex justify-center pb-2 select-none pointer-events-none z-50"><div class="w-24 h-1 rounded-full bg-outline-variant/60"></div></div>
