# API proxy used when BaoTa terminates TLS and forwards to this container.
# BaoTa sets X-Real-IP to the real client address; the container port is bound
# to 127.0.0.1 only, so the header cannot be reached from the internet.
location ^~ /api/v1/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $baota_client_ip;
    proxy_set_header X-Forwarded-Proto $baota_forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

location = /api/v1 {
    return 308 /api/v1/;
}
