user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    log_format toolbox '$time_iso8601 method=$request_method status=$status '
                       'bytes=$body_bytes_sent duration=$request_time trace=$upstream_http_x_trace_id';
    access_log /dev/stdout toolbox;

    server {
        listen 8080;
        server_name _;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location / { return 404; }
    }

    include /etc/nginx/conf.d/*.conf;
}
