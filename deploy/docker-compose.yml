name: ${COMPOSE_PROJECT_NAME:-cangshuo-toolbox}

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toolbox}
      MYSQL_USER: ${MYSQL_USER:-toolbox}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Initialize MYSQL_ROOT_PASSWORD in the environment file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Initialize MYSQL_PASSWORD in the environment file}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: &container-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.8.3-alpine3.23
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Initialize REDIS_PASSWORD in the environment file}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Initialize REDIS_PASSWORD in the environment file}
    command: ["sh", "/usr/local/bin/toolbox-redis.sh"]
    volumes:
      - redis-data:/data
      - type: bind
        source: ./redis/start.sh
        target: /usr/local/bin/toolbox-redis.sh
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *container-logging

  server:
    image: ${SERVER_IMAGE:-${COMPOSE_PROJECT_NAME:-cangshuo-toolbox}-api:${RELEASE_TAG:-0.1.0}}
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Initialize JWT_SECRET in the environment file}
      ADMIN_TOKEN_TTL_SECONDS: ${ADMIN_TOKEN_TTL_SECONDS:-3600}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TOKEN_PARAMETER: ${AI_TOKEN_PARAMETER:-max_completion_tokens}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_DAILY_ATTEMPTS: ${AI_DAILY_ATTEMPTS:-20}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-4}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-AI provider}
      STORAGE_ENABLED: ${STORAGE_ENABLED:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-toolbox_dev}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-toolbox-files}
      MINIO_PRESIGNED_EXPIRY_SECONDS: ${MINIO_PRESIGNED_EXPIRY_SECONDS:-900}
      MINIO_MAX_OBJECT_BYTES: ${MINIO_MAX_OBJECT_BYTES:-26214400}
      MINIO_ALLOWED_CONTENT_TYPES: ${MINIO_ALLOWED_CONTENT_TYPES:-image/png,image/jpeg,image/webp,application/pdf,text/plain}
      STORAGE_QUOTA_ENABLED: ${STORAGE_QUOTA_ENABLED:-true}
      STORAGE_MAX_OWNER_BYTES: ${STORAGE_MAX_OWNER_BYTES:-104857600}
      STORAGE_MAX_OWNER_OBJECTS: ${STORAGE_MAX_OWNER_OBJECTS:-200}
      STORAGE_MAX_TOTAL_BYTES: ${STORAGE_MAX_TOTAL_BYTES:-1073741824}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_ANONYMOUS: ${RATE_LIMIT_MAX_ANONYMOUS:-600}
      RATE_LIMIT_MAX_AUTHENTICATED: ${RATE_LIMIT_MAX_AUTHENTICATED:-3000}
      RATE_LIMIT_MAX_AUTH_ATTEMPTS: ${RATE_LIMIT_MAX_AUTH_ATTEMPTS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://tool.zhzgo.cn}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-toolbox}
      DB_USERNAME: ${MYSQL_USER:-toolbox}
      DB_SSL_MODE: ${DB_SSL_MODE:-REQUIRED}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Initialize MYSQL_PASSWORD in the environment file}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Initialize REDIS_PASSWORD in the environment file}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 30s
    logging: *container-logging

  admin:
    image: ${WEB_IMAGE:-${COMPOSE_PROJECT_NAME:-cangshuo-toolbox}-web:${RELEASE_TAG:-0.1.0}}
    build:
      context: ..
      dockerfile: admin/Dockerfile
      args:
        VITE_APP_BASE_PATH: /admin/
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-tool.zhzgo.cn}
      API_DOMAIN: ${API_DOMAIN:-toolapi.zhzgo.cn}
    depends_on:
      server:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *container-logging

  minio:
    image: ${COMPOSE_PROJECT_NAME:-cangshuo-toolbox}-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./minio
      dockerfile: Dockerfile
    profiles: [storage]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-toolbox_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Initialize MINIO_ROOT_PASSWORD in the environment file}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *container-logging

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  backend:
    internal: true
  edge:
