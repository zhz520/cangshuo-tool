<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#112b25">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>沧烁工具箱</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #173a30; background: #f3f7f5; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        main { width: min(680px, 100%); padding: clamp(28px, 7vw, 64px); background: white; border: 1px solid #e4ece7; border-radius: 24px; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; }
        .brand img { width: 36px; height: 36px; }
        .status { display: inline-block; margin-top: 44px; border-radius: 20px; padding: 6px 12px; background: #eaf5ef; color: #187b61; font-size: 13px; }
        h1 { margin: 18px 0; font-size: clamp(32px, 6vw, 48px); letter-spacing: -1px; }
        p { color: #697b72; line-height: 1.9; }
        a { display: inline-block; margin-top: 18px; padding: 13px 22px; border-radius: 10px; background: #157c65; color: white; text-decoration: none; }
        a:hover { background: #10624e; } a:focus-visible { outline: 3px solid #87c9b2; outline-offset: 4px; }
        footer { margin-top: 40px; color: #8a9890; font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <div class="brand"><img src="/favicon.svg" alt=""><span>沧烁工具箱</span></div>
        <span class="status">正在开发中</span>
        <h1>小工具，大效率。</h1>
        <p>一个以搜索为入口、优先在本地运行的工具平台。<br>Android 客户端和平台功能正在逐步完善。</p>
        <a href="/admin/">进入管理后台</a>
        <footer>沧烁工具箱 · 官网<br><a href="/permissions/">权限说明</a></footer>
    </main>
</body>
</html>
