spring:
  application:
    name: cangshuo-toolbox-api
  data:
    redis:
      client-type: lettuce
      client-name: cangshuo-toolbox-api
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:${LOCAL_REDIS_PORT:6379}}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        shutdown-timeout: 100ms
        pool:
          enabled: false
      repositories:
        enabled: false
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:${LOCAL_MYSQL_PORT:3306}}/${DB_NAME:${MYSQL_DATABASE:toolbox}}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:REQUIRED}&connectTimeout=3000&socketTimeout=5000
    username: ${DB_USERNAME:${MYSQL_USER:toolbox}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD}}
    hikari:
      pool-name: toolbox-db
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: always
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 34MB
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_1
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs

toolbox:
  ai:
    enabled: ${AI_ENABLED:false}
    endpoint: ${AI_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    token-parameter: ${AI_TOKEN_PARAMETER:max_completion_tokens}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    daily-attempts: ${AI_DAILY_ATTEMPTS:20}
    max-concurrent: ${AI_MAX_CONCURRENT:4}
    provider-name: ${AI_PROVIDER_NAME:AI provider}
  auth:
    jwt-secret: ${JWT_SECRET}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:toolbox-files}
    presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:900}
    max-object-bytes: ${MINIO_MAX_OBJECT_BYTES:26214400}
    allowed-content-types: ${MINIO_ALLOWED_CONTENT_TYPES:image/png,image/jpeg,image/webp,application/pdf,text/plain}
  quota:
    enabled: ${STORAGE_QUOTA_ENABLED:true}
    max-owner-bytes: ${STORAGE_MAX_OWNER_BYTES:104857600}
    max-owner-objects: ${STORAGE_MAX_OWNER_OBJECTS:200}
    max-total-bytes: ${STORAGE_MAX_TOTAL_BYTES:1073741824}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    max-anonymous-requests: ${RATE_LIMIT_MAX_ANONYMOUS:600}
    max-authenticated-requests: ${RATE_LIMIT_MAX_AUTHENTICATED:3000}
    max-auth-attempts: ${RATE_LIMIT_MAX_AUTH_ATTEMPTS:30}
  admin:
    token-ttl-seconds: ${ADMIN_TOKEN_TTL_SECONDS:3600}
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
